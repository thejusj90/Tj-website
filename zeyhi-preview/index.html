<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zeyhi Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000000;--s1:#0e0e0e;--s2:#161616;--s3:#191919;--s4:#1f1f1f;--line:#262626;--line2:#191919;--ink:#fefefe;--ink2:#c8c8c8;--muted:#8a8a8a;--dim:#6e6e6e;--sig:#ff9138;--sig-ink:#fa7d2a;--on-sig:#000000;--live:#43cf70;--alert:#ff5c4d;--lift:0 18px 48px rgba(0,0,0,.6);--sigbg:rgba(255,145,56,.10);--livebg:rgba(67,207,112,.14);--alertbg:rgba(255,92,77,.14)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#ffffff;--s1:#f6f6f6;--s2:#efefef;--s3:#e9e9e9;--s4:#e2e2e2;--line:#dcdcdc;--line2:#e6e6e6;--ink:#0e0e0e;--ink2:#3a3a3a;--muted:#6e6e6e;--dim:#8a8a8a;--sig-ink:#e2641c;--live:#1f9d4a;--lift:0 18px 48px rgba(0,0,0,.12);--livebg:rgba(31,157,74,.12)}}
:root[data-theme="light"]{color-scheme:light;--bg:#ffffff;--s1:#f6f6f6;--s2:#efefef;--s3:#e9e9e9;--s4:#e2e2e2;--line:#dcdcdc;--line2:#e6e6e6;--ink:#0e0e0e;--ink2:#3a3a3a;--muted:#6e6e6e;--dim:#8a8a8a;--sig-ink:#e2641c;--live:#1f9d4a;--lift:0 18px 48px rgba(0,0,0,.12);--livebg:rgba(31,157,74,.12)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
.mono,.lbl,.data,.kbd{font-family:"Martian Mono",ui-monospace,SFMono-Regular,monospace}
.lbl{font-size:11px;line-height:14px;letter-spacing:.14em;font-weight:500;text-transform:uppercase;color:var(--muted)}
.data{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.h1{margin:0;font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.h2{margin:0;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.01em}
.sub{font-size:15px;line-height:23px;color:var(--muted)}
.small{font-size:13px;line-height:19px;color:var(--muted)}
.card{background:var(--s1);border:1px solid var(--line2);border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;background:transparent}
.btn-primary{background:var(--sig);color:var(--on-sig)}.btn-primary:hover{filter:brightness(1.08)}
.btn-secondary{background:var(--s2);color:var(--ink);border-color:var(--line)}.btn-secondary:hover{background:var(--s4)}
.btn-ghost{color:var(--muted);padding:0 10px}.btn-ghost:hover{color:var(--ink)}
.btn-sm{height:36px;padding:0 14px;font-size:13px;border-radius:8px}
.btn-pill{border-radius:999px}
.btn:focus-visible,.opt:focus-visible,.nav-a:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.input{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-size:15px;color:var(--ink);width:100%}
.input input,.input select{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;outline:0}
.input input::placeholder{color:var(--dim)}
textarea.ta{width:100%;min-height:120px;resize:vertical;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font:inherit;font-size:14px;line-height:21px}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-direct{background:var(--livebg);color:var(--live)}.b-warm{background:var(--sigbg);color:var(--sig)}.b-weak{background:var(--s3);color:var(--muted)}.b-out{border:1px solid var(--dim);color:var(--muted)}.b-alert{background:var(--alertbg);color:var(--alert)}
.dot{width:8px;height:8px;border-radius:999px;flex:none}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--s3);color:var(--ink);font-weight:600;flex:none;font-size:12px}
.seg{display:inline-flex;padding:4px;border-radius:10px;background:var(--s1);border:1px solid var(--line2);gap:2px;max-width:100%;overflow-x:auto}
.seg button{height:34px;padding:0 14px;border-radius:7px;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--s3);color:var(--ink)}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{height:36px;padding:0 14px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tab.on{background:var(--s3);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--s1);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer}
.chip.on{color:var(--ink);border-color:var(--ink)}
.kbd{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--s2);border:1px solid var(--line);color:var(--muted)}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.toggle{width:40px;height:22px;border-radius:999px;background:var(--line);position:relative;flex:none;border:0;cursor:pointer;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:999px;background:var(--ink);transition:left .2s}
.toggle.on{background:var(--sig)}.toggle.on::after{left:21px;background:var(--on-sig)}
/* shell */
.app{display:flex;height:100%;min-height:100%}
.side{width:240px;flex:none;display:flex;flex-direction:column;gap:18px;padding:20px 14px 16px;border-right:1px solid var(--line2);background:var(--bg);height:100%;position:sticky;top:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.zmark{width:28px;height:28px;border-radius:15%;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.search-btn{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:10px;background:var(--s1);border:1px solid var(--line2);color:var(--muted);font-size:14px;cursor:pointer;text-align:left;width:100%}
.nav-g{display:flex;flex-direction:column;gap:4px}
.nav-g .lbl{padding:0 10px 4px}
.nav-a{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.nav-a.on{background:var(--s3);color:var(--ink)}
.nav-a .cnt{margin-left:auto;font-family:"Martian Mono",monospace;font-size:12px}
.wallet{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--s1);border:1px solid var(--line2);border-radius:10px;margin-top:auto}
.bar{height:3px;border-radius:999px;background:var(--s3);overflow:hidden}.bar i{display:block;height:100%;background:var(--sig)}
.user{display:flex;align-items:center;gap:10px;padding:4px 6px}
.icon-btn{width:30px;height:30px;border:0;background:transparent;color:var(--dim);display:inline-flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;flex:none}
.icon-btn:hover{color:var(--ink);background:var(--s2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;overflow-y:auto}
.page{width:100%;max-width:1080px;padding:20px 56px 40px;display:flex;flex-direction:column;gap:28px}
.page.chat{flex:1;padding-bottom:16px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;min-height:44px}
.topbar{display:none}
.bottombar{display:none}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:var(--sig);color:var(--on-sig);font-size:14px;font-weight:500;flex-wrap:wrap}
/* chat */
.chat-flow{display:flex;flex-direction:column;gap:20px;flex:1}
.bubble-user{align-self:flex-end;max-width:680px;padding:12px 18px;border-radius:16px 16px 4px 16px;background:var(--s3);font-size:16px;line-height:24px}
.agent{display:flex;gap:14px;align-items:flex-start}
.agent .body{display:flex;flex-direction:column;gap:12px;flex:1;min-width:0;padding-top:5px}
.msg{font-size:16px;line-height:26px;max-width:760px}
.trace-toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;border:0;background:transparent;padding:0;height:28px}
.trace{display:flex;flex-direction:column;gap:10px;padding:12px 16px;border-left:2px solid var(--line);margin:2px 0}
.trace .st{display:flex;align-items:flex-start;gap:12px;font-size:14px;color:var(--muted);animation:rise .22s ease both}
.trace .st:nth-child(2){animation-delay:.08s}.trace .st:nth-child(3){animation-delay:.16s}.trace .st:nth-child(4){animation-delay:.24s}
.trace .ok{width:16px;height:16px;border-radius:999px;background:var(--livebg);color:var(--live);display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:3px}
.trace .st b{color:var(--ink);font-weight:500}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.trace .run{width:16px;height:16px;border-radius:999px;border:2px solid var(--sig);border-right-color:transparent;animation:spin .8s linear infinite;flex:none;margin-top:3px}
.setup-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:40px;align-items:start}
.setup-mini{display:none;align-items:center;gap:12px}
.btn[disabled]{cursor:not-allowed}
@keyframes fade{from{opacity:0}to{opacity:1}}
.qcard{display:flex;flex-direction:column;gap:18px;padding:22px 24px;background:var(--s1);border:1px solid var(--line2);border-radius:16px;max-width:760px;animation:fade .26s ease both}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;min-height:48px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:15px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.opt:hover{background:var(--s2)}.opt.on{border-color:var(--sig);background:var(--sigbg)}
.opt .n{width:24px;height:24px;border-radius:6px;background:var(--s3);display:inline-flex;align-items:center;justify-content:center;font-family:"Martian Mono",monospace;font-size:12px;color:var(--muted);flex:none}
.opt.on .n{background:var(--sig);color:var(--on-sig)}
.opt.dashed{border-style:dashed}.opt.dashed span:last-child{color:var(--muted)}
.composer{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:16px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--lift);position:sticky;bottom:0}
.composer textarea{background:transparent;border:0;color:var(--ink);font:inherit;font-size:16px;resize:none;min-height:28px;outline:0;width:100%}
.composer textarea::placeholder{color:var(--dim)}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.quote{border-left:2px solid var(--sig);padding:4px 0 4px 18px;color:var(--ink2);font-size:15px;line-height:24px}
/* tables + rows */
.tbl-wrap{overflow-x:auto}
.tbl{display:grid;align-items:center;min-height:56px;padding:0 16px;border-top:1px solid var(--line2);font-size:14px;gap:12px}
.tbl.head{min-height:40px;border-top:0}
.tbl.sel{background:var(--sigbg)}
.rcard{display:grid;grid-template-columns:1.4fr 1.3fr 1.6fr auto;gap:24px;align-items:center;padding:20px 24px}
.task{display:flex;gap:16px;padding:18px 22px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.help{display:flex;flex-direction:column;gap:12px;padding:20px;cursor:pointer;transition:border-color .15s}
.help:hover{border-color:var(--dim)}
.prompt-pill{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line2);color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.field{display:flex;flex-direction:column;gap:4px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.field.miss{border:1px dashed var(--sig);background:var(--sigbg)}.field.miss .lbl,.field.miss span{color:var(--sig-ink)}
.qsel{position:relative}
.menu{position:absolute;top:100%;left:0;margin-top:6px;min-width:220px;background:var(--s2);border:1px solid var(--line);border-radius:10px;box-shadow:var(--lift);padding:6px;z-index:5;display:flex;flex-direction:column;gap:2px;animation:fade .15s}
.menu button{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:7px;border:0;background:transparent;font-size:14px;cursor:pointer;text-align:left;width:100%}
.menu button:hover{background:var(--s3)}
.send-btn{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.send-btn.hot{background:var(--sig);color:var(--on-sig);border-color:var(--sig)}
.bulk{position:sticky;bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--s2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--lift)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
.modal{width:min(760px,100%);max-height:92%;overflow-y:auto;background:var(--s1);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:24px;display:flex;flex-direction:column;gap:18px;animation:rise .24s ease}
@media (min-width:720px){.scrim{align-items:center;padding:24px}.modal{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:var(--lift);z-index:60;animation:rise .2s}
/* auth / setup */
.auth{display:flex;min-height:100%;width:100%}
.auth-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:48px 24px}
.auth-aside{flex:1;margin:16px 16px 16px 0;border-radius:22px;background:radial-gradient(120% 90% at 20% 0%,#ffb070 0%,#ff9138 38%,#d9601a 100%);color:#000;display:flex;flex-direction:column;justify-content:center;padding:64px;gap:24px;position:relative;overflow:hidden}
.auth-aside.quiet{background:var(--s1);color:var(--ink);border:1px solid var(--line2)}
.stepper{display:flex;align-items:flex-start;width:min(560px,100%)}
.stepper .s{display:flex;flex-direction:column;align-items:center;gap:10px;width:80px;flex:none}
.stepper .c{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:"Martian Mono",monospace;font-size:13px;background:var(--s2);color:var(--muted)}
.stepper .s.cur .c{background:var(--sig);color:var(--on-sig);box-shadow:0 0 24px rgba(255,145,56,.35)}
.stepper .s.done .c{background:var(--ink);color:var(--bg)}
.stepper .ln{flex:1;height:1px;background:var(--line);margin:16px -24px 0}
.stepper .ln.done{background:var(--ink)}
.setup-card{width:min(640px,100%);padding:32px;display:flex;flex-direction:column;gap:24px;border-color:var(--line)}
.src{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--bg)}

.page.wide{max-width:1200px}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer}
.hrow:hover{background:var(--s2)}
.hq{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-scrim{align-items:stretch!important;justify-content:flex-end!important;padding:0!important}
.drawer{width:min(460px,100%);height:100%;background:var(--s1);border-left:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:14px;animation:slidein .24s ease}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.kpi-v{font-size:32px;line-height:38px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.insight{display:flex;align-items:center;gap:14px;padding:16px 18px;flex-wrap:wrap}
.charts{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.chart{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}
.ch-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
.seg-arc{transition:stroke-width .15s}.seg-arc:hover{stroke-width:22}
.dn-big{font:600 24px Outfit,sans-serif;fill:var(--ink)}.dn-sub{font:500 10px 'Martian Mono',monospace;fill:var(--muted);letter-spacing:.06em}
.legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:180px;font-size:14px}
.lg{display:flex;align-items:center;gap:10px}.sw{width:10px;height:10px;border-radius:3px;flex:none}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.hb-track{height:6px;border-radius:999px;background:var(--s3);overflow:hidden}.hb-track i{display:block;height:100%;border-radius:999px}
.hb:hover .hb-track i{filter:brightness(1.2)}
.colchart,.linechart{width:100%;height:auto;overflow:visible}
.ax{font:500 10px 'Martian Mono',monospace;fill:var(--muted)}.ax-val{font:500 11px 'Martian Mono',monospace;fill:var(--ink)}
.colg:hover rect{filter:brightness(1.2)}
.funnel{display:flex;flex-direction:column;gap:12px}
.fn{display:grid;grid-template-columns:1fr;gap:5px}.fn-l{display:flex;justify-content:space-between;font-size:14px}
.fn-track{height:10px;border-radius:999px;background:var(--s3);overflow:hidden}.fn-track i{display:block;height:100%;border-radius:999px}
.fn-c{font-size:12px}
.gap{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2);flex-wrap:wrap}
.fine{padding:14px 18px}.fine summary{cursor:pointer}
.summary{display:flex;align-items:center;gap:18px;padding:16px 20px;flex-wrap:wrap}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.src-card{padding:18px;display:flex;flex-direction:column;gap:12px;min-height:250px}
.src-card.soon{border-style:dashed;background:transparent}
.set-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}
.set-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:20px}
.set-a{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;text-align:left;white-space:nowrap}
.set-a.on{background:var(--s3);color:var(--ink)}
.set-body{display:flex;flex-direction:column;gap:14px;max-width:760px;min-width:0}
.sset{padding:22px;display:flex;flex-direction:column;gap:16px}
.sset-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.rows{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2);font-size:14px;flex-wrap:wrap}
.rows .srow:first-child{border-top:0}
.note{padding:12px 14px;border-radius:10px;background:var(--s2);font-size:14px}
.bill-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.spark{display:flex;align-items:flex-end;gap:6px;height:44px;margin:10px 0 6px}.spark i{flex:1;background:var(--s3);border-radius:3px}
.packs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pack{padding:16px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;cursor:pointer;color:var(--ink);text-align:left}
.pack.on{border-color:var(--sig)}
.code{margin:0;padding:14px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font:12px/1.6 'Martian Mono',monospace;color:var(--ink2);overflow-x:auto}
.steps{display:flex;flex-direction:column;gap:12px}
.rail-step{display:flex;gap:12px;align-items:flex-start}
.rail-dot{width:22px;height:22px;border-radius:999px;flex:none;display:inline-flex;align-items:center;justify-content:center;font:500 11px 'Martian Mono',monospace;color:var(--muted);margin-top:1px}
.rail-dot.done{background:var(--livebg);color:var(--live)}.rail-dot.done svg{width:12px;height:12px}.rail-dot.cur{border:2px solid var(--sig);color:var(--sig)}.rail-dot.todo{border:1px solid var(--line)}

.lead-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.stage{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.st-i{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--s1);border:1px solid var(--line2);font-size:13px;color:var(--muted);white-space:nowrap}
.st-d{width:8px;height:8px;border-radius:999px;border:1.5px solid var(--dim)}
.st-i.done{color:var(--ink)}.st-i.done .st-d{background:var(--live);border-color:var(--live)}
.st-i.cur{color:var(--ink);border-color:var(--sig)}.st-i.cur .st-d{border-color:var(--sig);background:var(--sig)}
.lead-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.lead-main,.lead-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.pathline{display:flex;align-items:center;gap:0;flex-wrap:wrap;row-gap:14px}
.pl-node{display:flex;align-items:center;gap:10px;min-width:0}
.pl-edge{flex:1;min-width:28px;height:2px;background:linear-gradient(90deg,var(--live),var(--sig));margin:0 12px;border-radius:2px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-top:1px solid var(--line2)}.kv span:last-child{text-align:right}
.ct{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
.ct-i{width:34px;height:34px;border-radius:9px;background:var(--s2);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.ct-v{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.feed{display:flex;flex-direction:column}
.fi{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line2)}
.fi-dot{width:10px;height:10px;border-radius:999px;flex:none;margin-top:6px}
.fi-b{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.fi-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fi-pl{font-size:13px;font-weight:600}
.inv-grid{display:grid;grid-template-columns:1fr 150px;gap:10px}
.grid2>*,.grid3>*,.inv-grid>*,label{min-width:0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* responsive */
@media (max-width:1099px){
  .lead-grid{grid-template-columns:1fr}
  .lead-side{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .set-layout{grid-template-columns:1fr;gap:16px}
  .set-nav{flex-direction:row;overflow-x:auto;position:static}
  .c5,.c6,.c7{grid-column:span 12}

  .setup-mini{display:flex}

  .chip{height:36px}
  .icon-btn{width:40px;height:40px}

  .inv-grid{grid-template-columns:1fr 120px}
  /* shorter sign-up: no testimonial on setup steps */
  .auth-aside.quiet{display:none}
  .auth-main{padding:32px 16px 24px}
  .auth-aside{min-height:0;padding:24px}
  .auth-aside p{font-size:16px!important}
  /* chat: more width for cards */
  .agent{gap:10px}.agent>.av{width:28px!important;height:28px!important;font-size:12px!important}
  .qcard{padding:18px 16px}
  .qcard>div:first-child>.small{display:none}
  .opt{min-height:52px}
  .set-a{height:44px}
  .page.lead{gap:18px}

  .lead-side{grid-template-columns:1fr}
  .lead-h .pills{width:100%}.lead-h .pills .btn-primary{flex:1}
  .pl-edge{display:none}.pathline{flex-direction:column;align-items:flex-start}
  .fi-top .small[style*='margin-left']{margin-left:0!important}
  .kpis{grid-template-columns:1fr}
  .kpi-v{font-size:26px}
  .drawer{border-left:0}
  .app{flex-direction:column}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--bg);z-index:10}
  .bottombar{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
  .bottombar button{height:56px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;cursor:pointer}
  .bottombar button.on{color:var(--sig-ink)}
  .main{height:auto;flex:1}
  .page{padding:16px 16px 24px;gap:22px}
  .h1{font-size:24px;line-height:30px}
  .rcard{grid-template-columns:1fr;gap:12px}
  .rcard .actions{justify-content:flex-start}
  .grid2,.grid3,.opts.two{grid-template-columns:1fr}
  .auth{flex-direction:column}.auth-aside{margin:0 16px 16px;padding:32px 24px;min-height:260px}
  .auth-aside svg{display:none}
  .setup-card{padding:22px}
  .bubble-user{max-width:100%}
  .composer{position:static}
  .bulk{position:static}
  .stepper .s{width:64px}
  .src .small{display:none}
  .src{gap:10px}
}
@media (max-width:899px){
  /* phone + tablet portrait: tables become stacked cards */
  .tbl{display:flex!important;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:14px 16px!important;min-width:0!important;min-height:0!important}
  .tbl.head{display:none!important}
  .tbl>*{flex:0 1 auto;min-width:0;max-width:100%}
  .tbl>*:first-child:not(.opt){flex:1 1 100%}
  .tbl>.opt:first-child{order:-1}
  .tbl>.opt:first-child+*{flex:1 1 calc(100% - 40px)}
  .tbl .qsel,.tbl .send-btn{margin-left:auto}
  .tbl-wrap{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- charts ---------- */
function donut(parts,total,center,sub){
  const R=52,C=2*Math.PI*R; let off=0; const gap=2;
  const segs=parts.map(p=>{const len=Math.max(p.v/total*C-gap,0.5); const s=`<circle r="${R}" cx="70" cy="70" fill="none" style="stroke:${p.c}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" class="seg-arc"><title>${p.l}: ${p.v.toLocaleString()} (${Math.round(p.v/total*100)}%)</title></circle>`; off+=p.v/total*C; return s;}).join('');
  return `<div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="${sub}">${segs}<text x="70" y="68" text-anchor="middle" class="dn-big">${center}</text><text x="70" y="86" text-anchor="middle" class="dn-sub">${sub}</text></svg>
  <div class="legend">${parts.map(p=>`<div class="lg"><span class="sw" style="background:${p.c};${p.o?'border:1px solid var(--muted)':''}"></span><span style="flex:1">${p.l}</span><span class="data">${p.v.toLocaleString()} · ${Math.round(p.v/total*100)}%</span></div>`).join('')}</div></div>`;
}
function hbars(rows,opts={}){
  const max=Math.max(...rows.map(r=>r[1]));
  return `<div class="hbars">${rows.map((r,i)=>`<div class="hb" title="${r[0]}: ${r[1].toLocaleString()}"><div class="hb-top"><span>${r[0]}</span><span class="data">${r[1].toLocaleString()}${opts.pct?` · ${Math.round(r[1]/opts.pct*100)}%`:''}</span></div><div class="hb-track"><i style="width:${r[1]/max*100}%;background:${(opts.hl||[]).includes(i)?'var(--sig)':'var(--muted)'}"></i></div></div>`).join('')}</div>`;
}

    ${rows.map((r,i)=>{const h=r[1]/max*(H-18); const x=i*bw+bw*.22, w=bw*.56; return `<g class="colg"><title>${r[0]}: ${r[1]}</title><rect x="${x}" y="${H-h+2}" width="${w}" height="${h}" rx="4" style="fill:${i===0?'var(--sig)':'var(--muted)'}"/><text x="${x+w/2}" y="${H-h-4}" text-anchor="middle" class="ax-val">${r[1]}</text><text x="${x+w/2}" y="${H+22}" text-anchor="middle" class="ax">${r[0]}</text></g>`;}).join('')}

}
function line(pts,label){
  const W=520,H=150,mx=Math.max(...pts),mn=Math.min(...pts)*0.9,max=mx*1.05; const step=W/(pts.length-1);
  const xy=pts.map((v,i)=>[i*step,H-(v-mn)/(max-mn)*H]); const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="-4 -10 ${W+8} ${H+34}" class="linechart" role="img" aria-label="${label}">
    ${[0,.5,1].map(t=>`<line x1="0" x2="${W}" y1="${H-t*H}" y2="${H-t*H}" style="stroke:var(--line2)"/>`).join('')}
    <path d="${d} L ${W} ${H} L 0 ${H} Z" style="fill:var(--sigbg)"/><path d="${d}" fill="none" style="stroke:var(--sig)" stroke-width="2"/>
    ${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===xy.length-1?5:3}" style="fill:${i===xy.length-1?'var(--sig)':'var(--bg)'};stroke:var(--sig)" stroke-width="2"><title>Week ${i+1}: ${pts[i].toLocaleString()} contacts</title></circle>`).join('')}
    <text x="0" y="${H+22}" class="ax">12 weeks ago</text><text x="${W}" y="${H+22}" text-anchor="end" class="ax">This week · ${pts.at(-1).toLocaleString()}</text>
  </svg>`;
}
function funnel(rows){
  const max=rows[0][1];
  return `<div class="funnel">${rows.map((r,i)=>{const w=Math.max(r[1]/max*100,1.5); const prev=i?rows[i-1][1]:null; const pc=prev?r[1]/prev*100:null; const conv=i?(prev?(pc>0&&pc<1?'<1%':Math.round(pc)+'%')+' of previous':'no one to convert yet'):'';return `<div class="fn"><div class="fn-l"><span>${r[0]}</span><span class="data">${r[1].toLocaleString()}</span></div><div class="fn-track"><i style="width:${w}%;background:${i===0?'var(--muted)':'var(--sig)'}"></i></div><span class="small fn-c">${conv}</span></div>`;}).join('')}</div>`;
}

  if(d.hclose!==undefined){ if(e.target.closest('[data-stop]') && !t.classList.contains('icon-btn')) return; S.hist=false; render(); return; }
  if(d.hpin!==undefined){ e.stopPropagation(); const i=+d.hpin; S.pinned.has(i)?S.pinned.delete(i):S.pinned.add(i); render(); return; }
  if(d.hf!==undefined){ S.hfilter=d.hf; render(); return; }
  if(d.hopen!==undefined){ const h=HIST[+d.hopen]; S.hist=false; if(h.k==='deep'){ S.mode='research'; go('research-results'); } else { S.mode=h.k==='list'?'list':'search'; S.view=h.k==='list'?'table':'card'; go('discover'); } toast('Reopened “'+h.q.slice(0,40)+(h.q.length>40?'…':'')+'”. No credits used.'); return; }
  if(d.nh!==undefined){ S.nhTab=d.nh; render(); return; }
  if(d.mem!==undefined){ S.memMenu=S.memMenu===+d.mem?null:+d.mem; render(); return; }
  if(d.stab!==undefined){ S.stab=d.stab; render(); window.scrollTo(0,0); document.querySelector('.main')?.scrollTo(0,0); return; }
  if(d.sgo!==undefined){ S.stab=d.sgo; go('settings'); return; }
  if(d.mcp!==undefined){ S.mcp=!S.mcp; render(); toast(S.mcp?'MCP server enabled for Zeyhi Org':'MCP server disabled'); return; }
  if(d.share!==undefined){ S.share=!S.share; render(); toast(S.share?'Your network is shared with your team':'Your network is now private'); return; }
  if(d.why!==undefined){ S.why=!S.why; render(); return; }
  if(d.newkey!==undefined){ S.keys.push(['Key '+(S.keys.length+1),'zk_live_••••'+Math.random().toString(16).slice(2,6),'Aadarsh','Today','Never']); render(); toast('Key created. Copy it now; it won’t be shown again.'); return; }
  if(d.revoke!==undefined){ S.keys.splice(+d.revoke,1); render(); toast('Key revoked'); return; }
  if(d.copycode!==undefined){ const txt=document.getElementById('mcpcode')?.textContent||''; (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast('Config copied')).catch(()=>toast('Select the config and copy it')); return; }

  if(d.pf!==undefined){ S.pf=d.pf; render(); return; }
  if(d.reveal!==undefined){ S.revealPhone=true; render(); toast('Phone revealed · 1 credit · logged to your org'); return; }
  if(d.copytxt!==undefined){ (navigator.clipboard?.writeText(d.copytxt)||Promise.reject()).then(()=>toast('Copied')).catch(()=>toast(d.copytxt)); return; }
  if(d.route!==undefined){ S.routeSel=+d.route; S.routeOpen=true; render(); return; }
  if(d.sopt!==undefined){ const s=S.setup,i=s.step,k=+d.sopt; if(SQ[i].multi){ s.ans[i].has(k)?s.ans[i].delete(k):s.ans[i].add(k); } else { s.ans[i]=new Set([k]); } render(); return; }
  if(d.sother!==undefined){ const ta=document.querySelector('.composer textarea'); if(ta){ ta.focus(); ta.placeholder='Type your answer to question '+(S.setup.step+1)+' and press ⏎'; } return; }
  if(d.snext!==undefined){ const s=S.setup; if(!s.ans[s.step].size && !s.other[s.step]) return; advanceSetup(); return; }
  if(d.sskip!==undefined){ const s=S.setup; s.ans[s.step]=new Set(); s.other[s.step]=''; advanceSetup(); return; }
  if(d.sback!==undefined){ const s=S.setup; if(s.step>0){ s.step--; S.scrollBottom=true; render(); } return; }
  if(d.sedit!==undefined){ const s=S.setup; if(s.step>=5){ toast('Edit it in Settings → Playbook. Your first run already used these answers.'); return; } s.returnTo = s.step; s.step=+d.sedit; s.editingBack=true; S.scrollBottom=true; render(); return; }
  if(d.srun!==undefined){ startRun(); return; }
  if(d.sexit!==undefined){ S.setup.exitOpen=!S.setup.exitOpen; render(); return; }
  if(d.sexitgo!==undefined){ S.setup.exitOpen=false; S.setup.exited=true; go('today'); toast('Setup paused. Pick up from the banner anytime.'); return; }
  if(d.sfinish!==undefined){ S.setup.done=true; S.setup.exitOpen=false; if(S.setup.step<6) S.setup.step=Math.max(S.setup.step,4); if(d.go){ if(d.go.startsWith('research')) S.mode='research'; go(d.go); toast('Setup complete. Welcome to Zeyhi.'); } else if(d.act){ S.modal=+d.act.split(':')[1]; S.to='bridge'; go('today'); S.modal=0; render(); } return; }
  if(d.lead!==undefined){ S.lead=+d.lead; S.pf='all'; S.revealPhone=false; S.routeSel=0; }
  if(d.go!==undefined){ if(d.go==='discover'){S.mode='search';} if(d.go.startsWith('research')){S.mode='research';} go(d.go); return; }
  if(d.themeToggle!==undefined){ setTheme(isLight()?'dark':'light'); return; }
  if(d.trace!==undefined){ S.traceOpen[d.trace]=!S.traceOpen[d.trace]; render(); return; }
  if(d.q!==undefined){ const i=+d.i; if(d.q==='q2'){ S.q2.has(i)?S.q2.delete(i):S.q2.add(i);} else S[d.q]=i; render(); return; }
  if(d.tab!==undefined){ S.tab=d.tab; render(); return; }
  if(d.wtab!==undefined){ S.wtab=d.wtab; render(); return; }
  if(d.mode!==undefined){ S.mode=d.mode; if(d.mode==='research') go('research'); else if(d.mode==='list'){ S.view='table'; go('discover'); } else { go('discover'); } return; }
  if(d.view!==undefined){ S.view=S.view==='card'?'table':'card'; render(); return; }
  if(d.sel!==undefined){ const i=+d.sel; S.sel.has(i)?S.sel.delete(i):S.sel.add(i); render(); return; }
  if(d.clearsel!==undefined){ S.sel.clear(); render(); return; }
  if(d.qmenu!==undefined){ S.qmenu=S.qmenu===+d.qmenu?null:+d.qmenu; render(); return; }
  if(d.qset!==undefined){ const [i,q]=d.qset.split(':'); PATHS[+i].q=q; S.qmenu=null; toast(`Quality set to ${q}. Visible to the whole team.`); return; }
  if(d.pb!==undefined){ S.playbook=+d.pb; render(); return; }
  if(d.flip!==undefined){ t.classList.toggle('on'); return; }
  if(d.act!==undefined){ const [k,v]=d.act.split(':'); if(k==='send'){ S.modal=+v; S.to='bridge'; render(); } else if(k==='toast') toast(d.act.slice(6)); else go(d.act); return; }
  if(d.toast!==undefined){ toast(d.toast); return; }
  if(d.close!==undefined){ if(e.target.closest('[data-stop]') && !t.classList.contains('icon-btn')) return; S.modal=null; render(); return; }
  if(d.to!==undefined){ S.to=d.to; render(); return; }
  if(d.chan!==undefined){ S.chan=d.chan; render(); return; }
  if(d.copy!==undefined){ const txt=document.getElementById('draft')?.value||''; (navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast('Copied. Paste it where you talk to them, then mark it sent.')).catch(()=>{document.getElementById('draft')?.select();toast('Select and copy the draft, then mark it sent.');}); return; }
  if(d.sent!==undefined){ PATHS[+d.sent].status='Asked · waiting'; PATHS[+d.sent].hot=false; S.modal=null; toast('Marked as sent. Expires in 72 h; one nudge allowed.'); return; }
  if(d.send!==undefined){ const ta=t.closest('.composer').querySelector('textarea'); const v=(ta.value||'').trim(); if(!v){toast('Type something first');return;} if(S.route==='research'){ go('research-prompt'); } else if(S.route==='research-prompt'||S.route==='research-guided'){ go('research-results'); } else if(S.route==='agent'){ const st=S.setup; ta.value=''; if(st.step<4){ st.other[st.step]=v; if(!SQ[st.step].multi) st.ans[st.step]=new Set(); advanceSetup(); } else if(st.step===4){ startRun(); } else toast('Noted.'); } else toast('Sent to Zeyhi (prototype)'); return; }
});
document.addEventListener('input',e=>{ if(e.target.id==='hq'){ S.hq=e.target.value; const pos=e.target.selectionStart; render(); const el=document.getElementById('hq'); if(el){ el.focus(); el.setSelectionRange(pos,pos);} } });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.hist){ S.hist=false; render(); return; }
  if(e.key==='Escape'){ if(S.modal!==null){S.modal=null;render();return;} if(S.setup.exitOpen){S.setup.exitOpen=false;render();return;} }
  if(S.route!=='agent'||S.setup.step>=4||S.modal!==null) return;
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='textarea'||tag==='input'||tag==='select') { if(tag==='textarea'&&e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); document.querySelector('[data-send]')?.click(); } return; }
  const q=SQ[S.setup.step]; const n=parseInt(e.key,10);
  if(n>=1&&n<=q.opts.length){ document.querySelector(`[data-sopt="${n}"]`)?.click(); }
  else if(n===q.opts.length+1){ document.querySelector('[data-sother]')?.click(); e.preventDefault(); }
  else if(e.key==='Enter'){ document.querySelector('[data-snext]')?.click(); }
});
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(R[h] && h!==S.route){ S.route=h; if(h.startsWith('research')) S.mode='research'; render(); } });
try{ const t=localStorage.getItem('zeyhi-theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}
const h=location.hash.slice(1); if(R[h]){ S.route=h; if(h.startsWith('research')) S.mode='research'; }
render();
})();
</script>

</body></html>
